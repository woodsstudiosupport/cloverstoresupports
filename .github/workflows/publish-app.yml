name: Publish approved submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: catalogue-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Require a maintainer to approve
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('Only a repository maintainer may approve publication.');
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate submission and prepare catalogue changes
        run: python scripts/publish_submission.py
      - name: Commit and push validated data
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "Clover Bot"
          git config user.email "bot@woodsstudio.dev"
          git add apps/ registry.json reviews.json developers.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved submission #${ISSUE_NUMBER}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
      - name: Confirm publication after successful push
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Approved submission validated and published to the catalogue.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed'
            });
