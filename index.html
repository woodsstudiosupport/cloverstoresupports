(()=>{
 const REPOSITORY='woodsstudiosupport/cloverstoresupports',BRANCH='main';
 const ui={root:document.querySelector('#boot'),label:document.querySelector('#boot-label'),bar:document.querySelector('#boot-progress'),detail:document.querySelector('#boot-detail'),retry:document.querySelector('#boot-retry')};

 function progress(value,label,detail=''){ui.bar.value=value;ui.label.textContent=label;ui.detail.textContent=detail;ui.root.dataset.phase=stage}
 function path(value){if(typeof value!=='string'||!/^[-a-zA-Z0-9_./]+$/.test(value)||value.startsWith('/')||value.split('/').some(x=>!x||x==='.'||x==='..'))throw Error('Invalid resource path');return value}
 async function request(url,type='text'){
  const response=await fetch(url,{cache:'no-cache',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(20000)});
  if(!response.ok)throw Error('A required store file could not be loaded ('+response.status+').');
  const blob=await response.blob();if(blob.size>5*1024*1024)throw Error('Store resource is too large.');
  if(type==='blob')return blob;const text=await blob.text();return type==='json'?JSON.parse(text):text;
 }
 function validateNavigation(config){const allowed=new Set(['Discover','Browse','Search','Library','Developers','Updates','Downloads','Compare','Inspector','Settings']);
  for(const key of ['sidebar','menu','mobile','browser'])if(!Array.isArray(config[key])||!config[key].length||config[key].some(x=>!allowed.has(x))||new Set(config[key]).size!==config[key].length)throw Error('Invalid navigation configuration.');
  for(const route of ['Discover','Settings'])if(!config.sidebar.includes(route)||!config.menu.includes(route))throw Error('Required navigation is missing.');
 }
 function validateData(data){for(const key of ['registry','developers','announcements','collections','releases'])if(!Array.isArray(data[key]))throw Error('Invalid '+key+' catalogue.');if(!data.reviews||typeof data.reviews!=='object'||Array.isArray(data.reviews)||data.catalogue?.schemaVersion!==2)throw Error('Invalid catalogue metadata.');}

  const tasks=[...files.map(key=>({group:'files',key,url:manifest.files[key],type:key==='navigation'?'json':'text'})),...datasets.map(key=>({group:'data',key,url:manifest.data[key],type:'json'})),...Object.entries(manifest.assets).map(([key,url])=>({group:'assets',key,url:path(url),type:'blob'}))];
