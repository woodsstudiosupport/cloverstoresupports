<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c0b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; frame-src https:; form-action 'none'">
  <title>Clover Store · E3.HTML 2.2</title>
  <link rel="icon" href="https://raw.githubusercontent.com/woodsstudiosupport/cloverstoresupports/f92eae8caa64faa12867fc6f21973a58fb3a96de/web/assets/store-icon.png">
  <style>
    html, body { margin: 0; background: #080c0b; color: #edf5ef; font: 1rem/1.5 system-ui, sans-serif; }
    #store-launch { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: clamp(1rem, 4vw, 2.5rem); background: radial-gradient(ellipse at 50% 0%, #203c2f, #080c0b 74%); }
    #store-launch article { box-sizing: border-box; width: min(100%, 42rem); padding: clamp(1.25rem, 5vw, 3.25rem); overflow-wrap: anywhere; border: 1px solid #34463b; border-radius: 1.75rem; background: #111816; text-align: center; }
    #store-launch h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 3rem); line-height: 1.1; }
    #store-launch p { margin: 1rem 0 0; color: #bce8a5; white-space: pre-wrap; }
    #store-launch p:empty { display: none; }
    #launch-retry {margin-top:1.4rem;padding:.8rem 1.4rem;border:1px solid #55735f;background:#203c2f;color:#edf5ef;border-radius:1rem;font:inherit;cursor:pointer}
    #store-launch[data-state="notice"] {position:fixed;inset:0;z-index:2147483647;overflow:auto;}

    #store-launch[data-state="opening"] { position: fixed; inset: 0; z-index: 2147483647; background: #000; overflow: auto; }
    #store-launch[data-state="opening"] article { display: none; }
    #store-launch:not([data-state="opening"]) .startup-brand { display: none; }
    .startup-brand { display: grid; min-height: 250px; place-items: center; text-align: center; }
    .startup-logo { width: 84px; height: 84px; object-fit: contain; animation: logo-rise 1.05s .28s both; }
    .startup-studio { font-size: clamp(1.05rem, 4vw, 1.5rem); letter-spacing: .1em; animation: studio-centre 1s .12s both; }
    .startup-title { margin: 0; font-size: clamp(2rem, 8vw, 4rem); font-weight: 650; letter-spacing: -.055em; animation: store-draw .76s 1s both; }
    .startup-progress { margin: 10px 0 0; color: #bed0c9; font-size: .95rem; }
    .startup-spinner { width: 34px; aspect-ratio: 1; margin-top: 20px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 10%, #ab75ff 29%, #568bff 49%, #59d8c4 65%, #ffe379 81%, #fb7baa); animation: spinner-in .24s 1.72s both, spinner-turn 1s linear infinite; position: relative; }
    .startup-spinner::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #000; }
    @keyframes logo-rise { from { opacity: 0; transform: translateY(35px); } 45% { opacity: 1; } to { opacity: 1; transform: translateY(-12px); } }
    @keyframes studio-centre { from { opacity: 0; transform: translate(-28px, 22px); } to { opacity: 1; transform: translate(0); } }
    @keyframes store-draw { from { clip-path: inset(0 100% 0 0); opacity: 0; } 25% { opacity: 1; } to { clip-path: inset(0); opacity: 1; } }
    @keyframes spinner-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spinner-turn { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .startup-brand > * { animation: none; } }
  </style>
</head>
<body>
  <div id="e3-root" inert></div>
  <main id="store-launch" data-state="opening" aria-label="Clover Store startup">
      <div class="startup-brand">
        <img class="startup-logo" src="https://raw.githubusercontent.com/woodsstudiosupport/cloverstoresupports/main/e3/ui/assets/woods-logo.png" alt="" width="84" height="84">
        <div class="startup-studio">Woods Studio</div>
        <div class="startup-title">Clover Store</div>
        <div class="startup-spinner" aria-hidden="true"></div>
        <p class="startup-progress" id="startup-progress" role="status"></p>
      </div>
      <article>
        <h1 id="launch-title">Opening Clover Store</h1>
        <p id="launch-message"></p>
        <button id="launch-retry" type="button" hidden>Try again</button>
      </article>
    </main>
  <div id="e3-toast" role="status" hidden></div>
  <dialog id="e3-dialog" aria-label="Clover Store dialog"></dialog>
  <script type="module">
    const repository = 'woodsstudiosupport/cloverstoresupports';

    async function requestJSON(url) {
      const response = await fetch(url, {
        cache: 'no-store',
        credentials: 'omit',
        signal: AbortSignal.timeout(8000)
      });
      if (!response.ok) throw Error('Store configuration unavailable');
      return response.json();
    }

    const configBase = 'https://raw.githubusercontent.com/' + repository + '/main/web/';
    const noticeHeading = document.getElementById('launch-title');
    const noticeMessage = document.getElementById('launch-message');

    const startup = document.getElementById('store-launch');
    const storefront = document.getElementById('e3-root');
    const progress = document.getElementById('startup-progress');
    const retry = document.getElementById('launch-retry');
    retry.addEventListener('click', () => location.reload());
    let activeMode = null, checking = false;
    const maintenance = config => config?.tag === 'under-upgrades' || config?.storefront !== 'e3';
    const intro = matchMedia('(prefers-reduced-motion: reduce)').matches
      ? Promise.resolve()
      : new Promise(resolve => setTimeout(resolve, 2000));

    async function showMaintenance() {
      startup.dataset.state = 'notice';
      storefront.inert = true;
      const dialog = document.getElementById('e3-dialog');
      if (dialog.open) dialog.close();
      if (!startup.isConnected) document.body.append(startup);
      retry.hidden = true;
      try {
        const notice = await requestJSON(configBase + 'maintenance-notice.json?_=' + Date.now());
        if (typeof notice?.title !== 'string' || !notice.title.trim() ||
            typeof notice.message !== 'string') throw Error('Invalid maintenance notice');
        noticeHeading.textContent = notice.title;
        noticeMessage.textContent = notice.message;
      } catch {
        noticeHeading.textContent = 'Store temporarily unavailable';
        noticeMessage.textContent = 'Please check back soon.';
      }
    }

    async function launch() {
      await intro;
      progress.textContent = 'Checking store availability…';
      const config = await requestJSON(configBase + 'deployment.json?_=' + Date.now());
      activeMode = maintenance(config) ? 'notice' : 'store';
      if (activeMode === 'notice') {
        await showMaintenance();
        return;
      }

      progress.textContent = 'Finding the latest store version…';
      const ref = typeof config.tag === 'string' && config.tag.trim() ? config.tag.trim() : 'main';
      const {sha} = await requestJSON('https://api.github.com/repos/' + repository + '/commits/' + encodeURIComponent(ref));
      if (!/^[a-f0-9]{40}$/.test(sha || '')) throw Error('Invalid storefront revision');

      const base = 'https://cdn.jsdelivr.net/gh/' + repository + '@' + sha + '/e3/';
      progress.textContent = 'Loading storefront styles…';
      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = base + 'ui/design.css';
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(Error('Stylesheet timed out')), 12000);
        stylesheet.onload = () => {clearTimeout(timer); resolve();};
        stylesheet.onerror = () => {clearTimeout(timer); reject(Error('Stylesheet unavailable'));};
        document.head.append(stylesheet);
      });
      progress.textContent = 'Loading storefront files…';
      await import(base + 'runtime/app.mjs');
      progress.textContent = 'Initialising the catalogue…';
      await waitForStorefront();
      if (activeMode === 'notice') return;
      storefront.inert = false;
      startup.remove();
    }

    function waitForStorefront() {
      return new Promise((resolve, reject) => {
        const observer = new MutationObserver(check);
        const timeout = setTimeout(() => finish(new Error('Store startup timed out')), 30000);
        function finish(error) {
          observer.disconnect();
          clearTimeout(timeout);
          if (error) reject(error);
          else resolve();
        }
        function check() {
          if (storefront.querySelector('.e3-shell')) finish();
          else if (storefront.querySelector('.boot [data-action="reload"]')) finish(new Error('Store startup failed'));
        }
        observer.observe(storefront, { childList: true, subtree: true });
        check();
      });
    }

    // Recheck the GitHub deployment state without a new EdgeOne deployment.
    setInterval(async () => {
      if (checking || activeMode === null || document.hidden) return;
      checking = true;
      try {
        const config = await requestJSON(configBase + 'deployment.json?_=' + Date.now());
        const locked = maintenance(config);
        if (locked) {activeMode = 'notice'; await showMaintenance();}
        else if (activeMode === 'notice') location.reload();
      } catch { /* Keep the last confirmed state; transient network failure is not a maintenance command. */ }
      finally { checking = false; }
    }, 30000);
    launch().catch(() => {
      if (activeMode === 'notice') return;
      startup.dataset.state = 'notice';
      noticeHeading.textContent = 'Store temporarily unavailable';
      noticeMessage.textContent = 'Check your connection and try again.';
      retry.hidden = false;
    });
  </script>
</body>
</html>
