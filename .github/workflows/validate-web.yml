name: Validate web app
on:
  push:
    paths: ['index.html', 'web/**', '.github/workflows/validate-web.yml']
  pull_request:
    paths: ['index.html', 'web/**', '.github/workflows/validate-web.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/tests/*.test.cjs
