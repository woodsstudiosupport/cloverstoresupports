name: Sync approved DevSuite release sources
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-publication
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Import eligible releases and validate catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_devsuite.py
      - name: Build E3 snapshot and publish the same change
        run: |
          if git diff --quiet -- registry.json releases.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry.json releases.json apps/
          git commit -m 'Import approved DevSuite Windows releases'
          python e3/scripts/snapshot.py . "$(git rev-parse HEAD)"
          git add e3/content/{catalogue-snapshot,ads,account,offline,subscriptions,open-source}.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh E3 snapshot for DevSuite releases'; fi
          git push origin HEAD:main
