name: Refresh E3 catalogue snapshot
on:
  push:
    branches: [main]
    paths: ['registry.json', 'developers.json', 'reviews.json', 'collections.json', 'releases.json', 'announcements.json', 'catalogue.json', 'e3/content/app-metadata.json', 'e3/scripts/snapshot.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: e3-catalogue-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build complete snapshot
        run: python3 e3/scripts/snapshot.py . "$(git rev-parse HEAD)" e3/content/catalogue-snapshot.json
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e3/content/{catalogue-snapshot,ads,account,offline,subscriptions,open-source}.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh E3 catalogue snapshot'
          git push origin HEAD:main
