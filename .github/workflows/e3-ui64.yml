name: Build E3.UI64 Windows preview
on:
  push:
    branches: [e3/ui64-preview]
  workflow_dispatch:
concurrency:
  group: e3-ui64-preview
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test shared runtime
        run: node --test e3/tests/core.test.mjs e3/tests/updater.test.mjs
      - name: Publish Windows x64
        run: dotnet publish e3/ui64/CloverStore.UI64.csproj -c Release --self-contained true -o publish
      - name: Check packaged E3 assets
        shell: pwsh
        run: |
          foreach ($path in @('CloverStore.UI64.exe', 'store/index.html', 'store/runtime/app.mjs', 'store/ui/design.css', 'store/content/catalogue-snapshot.json')) {
            if (!(Test-Path "publish/$path" -PathType Leaf)) { throw "Missing $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CloverStore-E3.UI64-win-x64
          path: publish
          if-no-files-found: error
      - name: Create versioned Windows release
        if: github.ref == 'refs/heads/e3/ui64-preview'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content e3/ui64/CloverStore.UI64.csproj -Raw
          $version = [string]($project.Project.PropertyGroup.Version)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Windows version: $version" }
          $tag = "ui64-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Bump Version to publish a new build."
            exit 0
          }
          $archive = "CloverStore-E3.UI64-$version-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $archive
          gh release create $tag $archive --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title "Clover Store E3.UI64 $version" --prerelease --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $tag" }
